services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_ecs_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-local}
      - DB_PASSWORD=${DB_PASSWORD:-local}
      - DB_NAME=${DB_NAME:-db_local}
    command: uv run uvicorn app.main:app --app-dir src --host 0.0.0.0 --port 8000 --reload
